# Builds the riverside-town-roku-generator Docker image and publishes it to
# the GitHub Container Registry when a version tag such as v1.2.0 is pushed.
# The image gets the tags 1.2.0, 1.2, 1, and latest. The git tag v1 is also
# moved to this commit, so repositories that use rorpage/riverside-town@v1
# get the new version.
name: riverside-town-roku-generator

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rorpage/riverside-town-roku-generator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Move the major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
